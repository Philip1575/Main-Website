name: Publish website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  # Build and deploy run as separate jobs (GitHub's standard Pages setup).
  # Deploying in the same job as the upload intermittently fails with
  # "No artifacts named github-pages were found".
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v6
      - name: Prepare public files
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          mkdir _site
          cp -R assets _site/
          cp *.html *.css *.js .nojekyll _site/
          python - <<'PY'
          import json, os
          from pathlib import Path
          Path('_site/maps-config.json').write_text(json.dumps({'apiKey': os.environ.get('GOOGLE_MAPS_API_KEY', '')}))
          PY
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
